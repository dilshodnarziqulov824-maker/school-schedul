<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dars jadvali — School Schedule</title>
  <meta name="description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:title" content="Dars jadvali — School Schedule" />
  <meta property="og:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dars jadvali — School Schedule" />
  <meta name="twitter:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 30px 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    background-repeat: no-repeat;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
  }

  .topbar, .hero, .tools, .stats {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    margin-bottom: 22px;
  }

  .brand { font-weight: 800; letter-spacing: .4px; }
  .brand span { color: #38bdf8; }
  .live { color: #86efac; font-size: 13px; }

  .hero {
    padding: 28px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #1e3a8a, #0f766e);
  }

  .hero h1 { text-align: left; margin: 0 0 8px; color: white; }
  .hero p { margin: 0; color: #dbeafe; }

  .tools {
    display: flex;
    gap: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .tools input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 15px;
  }

  .tools button, .day-toggle {
    transition: .25s ease;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .next-lesson {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 18px;
    margin-bottom: 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
  }

  .next-lesson small { color: #94a3b8; display: block; margin-bottom: 5px; }
  .next-lesson strong { color: #fff; font-size: 20px; }
  .countdown { color: #38bdf8; font-size: 24px; font-weight: 800; white-space: nowrap; }

  .stat { padding: 12px; background: #0f172a; border-radius: 12px; }
  .stat strong { display: block; font-size: 22px; color: #38bdf8; }
  .stat small { color: #94a3b8; }

  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-size: 30px;
  }

  .header-note {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 22px;
  }

  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .day-card {
    background: #fff;
    border: 1px solid #000000;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .day-card.open {
    border: 2px solid #030303;
    background: #eef7ff;
  }

  .day-toggle {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    padding: 8px 8px 12px;
    color: #ffffff;
    transition: .25s ease;
  }

  .day-toggle.active {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 8px;
  }

  .today-button {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.12);
  }

  .day-content {
    margin-top: 8px;
    background: rgba(0, 0, 0, 0.28);
    padding: 8px 10px;
    border-radius: 8px;
    max-height: 1000px;
    opacity: 1;
    overflow: hidden;
    transition: max-height 1s ease, opacity 1s ease, padding 0.5s ease, margin 0.5s ease;
  }

  .day-content.collapsed {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-top: 0;
  }

  .subjects {
    list-style: none;
    margin: 0;
    padding: 0;
    color: #000000;
  }

  .subjects li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    line-height: 1.4;
    color: #ffffff;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  }

  .subjects li small {
    color: #bae6fd;
    white-space: nowrap;
    font-size: 12px;
  }

  .subjects li:last-child {
    border-bottom: 0;
  }

  .empty {
    color: #fff;
    font-style: italic;
  }

  .day-card.hidden-card { display: none; }
  .no-results { text-align: center; color: #94a3b8; padding: 30px; }

  @media (max-width: 600px) {
    h1 {
      font-size: 24px;
    }

    .day-name {
      font-size: 18px;
    }
    .tools { flex-direction: column; }
    .stats { grid-template-columns: 1fr; }
    .next-lesson { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>

<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">School <span>Schedule</span></div>
      <div class="live">● Jonli jadval</div>
    </header>
    <section class="hero">
      <h1>Dars jadvali</h1>
      <p id="headerNote"></p>
    </section>
    <section class="tools">
      <input id="searchInput" type="search" placeholder="Fan yoki kunni qidiring...">
    </section>
    <section class="stats">
      <div class="stat"><strong id="todayStat">—</strong><small>Bugungi kun</small></div>
      <div class="stat"><strong id="lessonStat">—</strong><small>Bugungi darslar</small></div>
      <div class="stat"><strong id="clockStat">--:--</strong><small>Hozirgi vaqt</small></div>
    </section>
    <section class="next-lesson">
      <div>
        <small>Keyingi dars</small>
        <strong id="nextLesson">Hisoblanmoqda...</strong>
      </div>
      <div id="countdown" class="countdown">--:--:--</div>
    </section>
    <div id="schedule" class="schedule-grid"></div>
  </div>

  <script>
    const sections = [
      [
        '1 Kelajak soati',
        '2 Adabiyot',
        '3 Algebra',
        '4 CHQBT',
        '5 Kimyo',
        '6 Jismoniy tarbiya'
      ],
      [
        '1 Tadbirkorlik asoslari',
        '2 ChQBT',
        '3 Algebra',
        '4 Fizika',
        '5 Kimyo',
        '6 Biologiya'
      ],
      [
        '1 Ingliz tili',
        '2 Informatika',
        '3 Jismoniy tarbiya',
        "4 O'zbekiston tarixi",
        '5 ------',
        '6 ------'
      ],
      [
        '1 Ingliz tili',
        '2 ChQBT',
        '3 Rus tili',
        '4 Adabiyot',
        '5 Davlat huquq asoslari',
        '6 -----'
      ],
      [
        '1 Rus tili',
        '2 Informatika',
        '3 Algebra',
        '4 Fizika',
        '5 Biologiya',
        '6 Jahon tarixi'
      ],
      [
        '1 Algebra',
        '2 Ona tili',
        '3 Adabiyot',
        '4 Tarbiya',
        '5 Astronomiya',
        '6 -----'
      ]
    ];

    const week = [
      'Dushanba',
      'Seshanba',
      'Chorshanba',
      'Payshanba',
      'Juma',
      'Shanba',
      'Yakshanba'
    ];

    const scheduleByDay = {
      Dushanba: sections[0],
      Seshanba: sections[1],
      Chorshanba: sections[2],
      Payshanba: sections[3],
      Juma: sections[4],
      Shanba: sections[5],
      Yakshanba: ['Dam olish kuni']
    };

    const dayToPart = {
      Dushanba: 1,
      Seshanba: 2,
      Chorshanba: 3,
      Payshanba: 4,
      Juma: 5,
      Shanba: 6,
      Yakshanba: 1
    };

    const todayDate = new Date();
    const uzDayNames = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
    const todayName = uzDayNames[todayDate.getDay()];
    const tomorrowDate = new Date(todayDate);
    tomorrowDate.setDate(todayDate.getDate() + 1);
    const tomorrowName = uzDayNames[tomorrowDate.getDay()];
    const tomorrowPart = dayToPart[tomorrowName] || 1;
    const todayText = `${todayDate.getDate()}.${String(todayDate.getMonth() + 1).padStart(2, '0')}.${todayDate.getFullYear()}`;
    const tomorrowText = `${tomorrowDate.getDate()}.${String(tomorrowDate.getMonth() + 1).padStart(2, '0')}.${tomorrowDate.getFullYear()}`;

    const defaultOpenDay = todayName === 'Shanba' ? 'Shanba' : (todayName === 'Yakshanba' ? 'Dushanba' : todayName);
    const dayImageUrl = 'dars.png';
    const restDayImageUrl = 'dam.png';
    const todayDay = todayName;

    document.getElementById('headerNote').textContent =
      `Bugun ${todayText} (${todayName}). Ertaga ${tomorrowText} (${tomorrowName}) kuni ${tomorrowPart}-qism ko'rsatiladi.`;

    const schedule = document.getElementById('schedule');
    const searchInput = document.getElementById('searchInput');
    const todayStat = document.getElementById('todayStat');
    const lessonStat = document.getElementById('lessonStat');
    const clockStat = document.getElementById('clockStat');
    const nextLesson = document.getElementById('nextLesson');
    const countdown = document.getElementById('countdown');
    const lessonTimes = [
      ['08:00', '08:45'],
      ['08:50', '09:35'],
      ['09:45', '10:30'],
      ['10:40', '11:25'],
      ['11:35', '12:20'],
      ['12:30', '13:15']
    ];

    todayStat.textContent = todayName;
    lessonStat.textContent = todayName === 'Yakshanba'
      ? '0'
      : scheduleByDay[todayName].filter(subject => subject !== '0').length;

    function updateClock() {
      clockStat.textContent = new Date().toLocaleTimeString('uz-UZ', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    function getTodayLesson(index) {
      const subject = scheduleByDay[todayName]?.[index];
      return subject && subject !== '0' && !subject.includes('-') ? subject : null;
    }

    function updateNextLesson() {
      if (todayName === 'Yakshanba') {
        nextLesson.textContent = 'Bugun dam olish kuni';
        countdown.textContent = '—';
        return;
      }

      const now = new Date();
      let nextIndex = -1;
      let target = null;

      lessonTimes.some((time, index) => {
        const [hours, minutes] = time[0].split(':');
        const start = new Date(now);
        start.setHours(Number(hours), Number(minutes), 0, 0);
        if (start > now && getTodayLesson(index)) {
          nextIndex = index;
          target = start;
          return true;
        }
        return false;
      });

      if (nextIndex === -1) {
        nextLesson.textContent = 'Bugungi darslar tugadi';
        countdown.textContent = '—';
        return;
      }

      nextLesson.textContent = `${nextIndex + 1}-dars: ${getTodayLesson(nextIndex)}`;
      const seconds = Math.max(0, Math.floor((target - now) / 1000));
      const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const remainSeconds = String(seconds % 60).padStart(2, '0');
      countdown.textContent = `${hours}:${minutes}:${remainSeconds}`;
    }

    updateNextLesson();
    setInterval(updateNextLesson, 1000);

    week.forEach((day) => {
      const subjects = scheduleByDay[day] || ['-'];
      const card = document.createElement('div');
      const isOpen = day === defaultOpenDay;
      const isSunday = day === 'Yakshanba';
      const isToday = day === todayDay;

      card.className = `day-card ${isOpen ? 'open' : ''}`;
      card.dataset.search = `${day} ${subjects.join(' ')}`.toLowerCase();
      if (isSunday) {
        card.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.35), rgba(0,0,0)), url('${restDayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      } else {
        card.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.35), rgba(0,0,0)), url('${dayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = `day-toggle ${isOpen ? 'active' : ''} ${isToday ? 'today-button' : ''}`;
      button.textContent = day;

      if (isSunday) {
        button.style.color = '#000';
        button.style.fontWeight = '700';
      }

      if (isToday) {
        button.style.border = '2px solid #fff';
        button.style.borderRadius = '8px';
      }

      const content = document.createElement('div');
      content.className = 'day-content';
      content.innerHTML = `
        <ul class="subjects">
          ${subjects.map((subject, index) => `
            <li>
              <span>${subject === '0' ? '<span class="empty">-</span>' : subject}</span>
              ${subject !== '0' && subject !== 'Dam olish kuni' && !subject.includes('-') && lessonTimes[index]
                ? `<small>${lessonTimes[index][0]} – ${lessonTimes[index][1]}</small>`
                : ''}
            </li>
          `).join('')}
        </ul>
      `;

      if (!isOpen) {
        content.classList.add('collapsed');
      }

      button.addEventListener('click', () => {
        const isVisible = !content.classList.contains('collapsed');

        document.querySelectorAll('.day-content').forEach(el => {
          el.style.transition = 'max-height 0.5s ease, opacity 0.5s ease, padding 0.5s ease, margin 0.5s ease';
          el.classList.add('collapsed');
        });
        document.querySelectorAll('.day-toggle').forEach(el => {
          el.classList.remove('active');
        });

        if (!isVisible) {
          content.style.transition = 'max-height 1s ease, opacity 1s ease, padding 1s ease, margin 1s ease';
          content.classList.remove('collapsed');
          button.classList.add('active');
        }
      });

      card.appendChild(button);
      card.appendChild(content);
      schedule.appendChild(card);
    });

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.day-card').forEach(card => {
        card.classList.toggle('hidden-card', !card.dataset.search.includes(query));
      });
    });
  </script>
</body>


</html>
