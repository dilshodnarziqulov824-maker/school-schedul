<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dars jadvali — School Schedule</title>
  <meta name="description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:title" content="Dars jadvali — School Schedule" />
  <meta property="og:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dars jadvali — School Schedule" />
  <meta name="twitter:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 30px 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    background-repeat: no-repeat;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
  }

  .topbar, .hero, .tools, .stats {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    margin-bottom: 22px;
  }

  .brand { font-weight: 800; letter-spacing: .4px; }
  .brand span { color: #38bdf8; }
  .live { color: #86efac; font-size: 13px; }

  .hero {
    padding: 28px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #1e3a8a, #0f766e);
  }

  .hero h1 { text-align: left; margin: 0 0 8px; color: white; }
  .hero p { margin: 0; color: #dbeafe; }

  .tools {
    display: flex;
    gap: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .tools input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 15px;
  }

  .tools button {
    border: 0;
    border-radius: 10px;
    padding: 0 18px;
    background: #38bdf8;
    color: #082f49;
    font-weight: 800;
    cursor: pointer;
  }

  .tools button:hover { background: #7dd3fc; }

  .save-button {
    display: block;
    margin: 22px auto 0;
    border: 0;
    border-radius: 10px;
    padding: 12px 28px;
    background: #38bdf8;
    color: #082f49;
    font-weight: 800;
    cursor: pointer;
  }

  .save-button:hover { background: #7dd3fc; }

  .save-day-button {
    width: 100%;
    margin-top: 12px;
    border: 1px solid #38bdf8;
    border-radius: 8px;
    padding: 9px;
    background: #0284c7;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .save-day-button:hover { background: #0369a1; }

  .tools button, .day-toggle {
    transition: .25s ease;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .next-lesson {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 18px;
    margin-bottom: 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
  }

  .next-lesson small { color: #94a3b8; display: block; margin-bottom: 5px; }
  .next-lesson strong { color: #fff; font-size: 20px; }
  .countdown { color: #38bdf8; font-size: 24px; font-weight: 800; white-space: nowrap; }

  .calendar {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-header h2 { margin: 0; font-size: 20px; color: #fff; }
  .calendar-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    padding: 0;
  }
  .calendar-toggle span:last-child { color: #38bdf8; font-size: 14px; }
  .calendar-body {
    max-height: 500px;
    opacity: 1;
    overflow: hidden;
    transition: max-height .5s ease, opacity .5s ease, margin-top .5s ease;
  }
  .calendar-body.collapsed {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
  }
  .calendar-header button {
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 6px 10px;
    background: #0f172a;
    color: #fff;
    cursor: pointer;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .calendar-weekday {
    padding: 6px 2px;
    color: #94a3b8;
    font-size: 12px;
    text-align: center;
  }

  .calendar-day {
    min-height: 42px;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 4px;
    background: #0f172a;
    color: #cbd5e1;
    text-align: center;
  }

  .calendar-day.lesson-day { border-color: #0ea5e9; color: #fff; }
  .calendar-day.today { background: #0284c7; border-color: #7dd3fc; color: #fff; font-weight: 800; }
  .calendar-day.selected {
    border: 2px solid #facc15;
    box-shadow: 0 0 0 3px rgba(250, 204, 21, .3);
    transform: translateY(-2px);
  }
  .calendar-day.clickable { cursor: pointer; }
  .calendar-day.clickable:hover { border-color: #facc15; }
  .calendar-day.empty { border-color: transparent; background: transparent; }
  .calendar-day small { display: block; margin-top: 3px; color: #86efac; font-size: 9px; }

  .stat { padding: 12px; background: #0f172a; border-radius: 12px; }
  .stat strong { display: block; font-size: 22px; color: #38bdf8; }
  .stat small { color: #94a3b8; }

  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-size: 30px;
  }

  .header-note {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 22px;
  }

  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .day-card {
    background: #fff;
    border: 1px solid #000000;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .day-card.open {
    border: 2px solid #030303;
    background: #eef7ff;
  }

  .day-toggle {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    padding: 8px 8px 12px;
    color: #ffffff;
    transition: .25s ease;
  }

  .day-toggle.active {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 8px;
  }

  .today-button {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.12);
  }

  .day-content {
    margin-top: 8px;
    background: rgba(0, 0, 0, 0.28);
    padding: 8px 10px;
    border-radius: 8px;
    max-height: 1000px;
    opacity: 1;
    overflow: hidden;
    transition: max-height 1s ease, opacity 1s ease, padding 0.5s ease, margin 0.5s ease;
  }

  .day-content.collapsed {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-top: 0;
  }

  .subjects {
    list-style: none;
    margin: 0;
    padding: 0;
    color: #000000;
  }

  .subjects li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    line-height: 1.4;
    color: #ffffff;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  }

  .subjects li small {
    color: #bae6fd;
    white-space: nowrap;
    font-size: 12px;
  }

  .subject-input {
    width: 100%;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 6px;
    padding: 7px 8px;
    background: rgba(15,23,42,.75);
    color: #fff;
    font: inherit;
  }

  .lesson-number {
    min-width: 18px;
    color: #bae6fd;
    font-weight: 800;
  }

  .subjects li:last-child {
    border-bottom: 0;
  }

  .empty {
    color: #fff;
    font-style: italic;
  }

  .day-card.hidden-card { display: none; }
  .no-results { text-align: center; color: #94a3b8; padding: 30px; }

  @media (max-width: 600px) {
    h1 {
      font-size: 24px;
    }

    .day-name {
      font-size: 18px;
    }
    .tools { flex-direction: column; }
    .stats { grid-template-columns: 1fr; }
    .next-lesson { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>

<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">School <span>Schedule</span></div>
      <div class="live">● Jonli jadval</div>
    </header>
    <section class="hero">
      <h1>Dars jadvali</h1>
      <p id="headerNote"></p>
    </section>
    <section class="tools">
      <input id="searchInput" type="search" placeholder="Fan yoki kunni qidiring...">
    </section>
    <section class="stats">
      <div class="stat"><strong id="todayStat">—</strong><small>Bugungi kun</small></div>
      <div class="stat"><strong id="lessonStat">—</strong><small>Bugungi darslar</small></div>
      <div class="stat"><strong id="clockStat">--:--</strong><small>Hozirgi vaqt</small></div>
    </section>
    <section class="next-lesson">
      <div>
        <small>Keyingi dars</small>
        <strong id="nextLesson">Hisoblanmoqda...</strong>
      </div>
      <div id="countdown" class="countdown">--:--:--</div>
    </section>
    <section class="calendar">
      <div class="calendar-header">
        <button id="calendarToggle" class="calendar-toggle" type="button" aria-expanded="true">
          <span id="calendarTitle"></span>
          <span>Yopish ▲</span>
        </button>
      </div>
      <div id="calendarBody" class="calendar-body">
        <div class="calendar-header">
          <button id="previousMonth" type="button" aria-label="Oldingi oy">‹</button>
          <span></span>
          <button id="nextMonth" type="button" aria-label="Keyingi oy">›</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
    </section>
    <div id="schedule" class="schedule-grid"></div>
  </div>

  <script>
    const sections = [
      [
        '1 Kelajak soati',
        '2 Adabiyot',
        '3 Algebra',
        '4 CHQBT',
        '5 Kimyo',
        '6 Jismoniy tarbiya'
      ],
      [
        '1 Tadbirkorlik asoslari',
        '2 ChQBT',
        '3 Algebra',
        '4 Fizika',
        '5 Kimyo',
        '6 Biologiya'
      ],
      [
        '1 Ingliz tili',
        '2 Informatika',
        '3 Jismoniy tarbiya',
        "4 O'zbekiston tarixi",
        '5 ------',
        '6 ------'
      ],
      [
        '1 Ingliz tili',
        '2 ChQBT',
        '3 Rus tili',
        '4 Adabiyot',
        '5 Davlat huquq asoslari',
        '6 -----'
      ],
      [
        '1 Rus tili',
        '2 Informatika',
        '3 Algebra',
        '4 Fizika',
        '5 Biologiya',
        '6 Jahon tarixi'
      ],
      [
        '1 Algebra',
        '2 Ona tili',
        '3 Adabiyot',
        '4 Tarbiya',
        '5 Astronomiya',
        '6 -----'
      ]
    ];

    const week = [
      'Dushanba',
      'Seshanba',
      'Chorshanba',
      'Payshanba',
      'Juma',
      'Shanba',
      'Yakshanba'
    ];

    const scheduleByDay = {
      Dushanba: sections[0],
      Seshanba: sections[1],
      Chorshanba: sections[2],
      Payshanba: sections[3],
      Juma: sections[4],
      Shanba: sections[5],
      Yakshanba: ['Dam olish kuni']
    };

    Object.keys(scheduleByDay).forEach(day => {
      scheduleByDay[day] = scheduleByDay[day].map(subject =>
        subject.replace(/^\d+\s*/, '')
      );
    });

    const savedSchedule = localStorage.getItem('schoolSchedule');
    if (savedSchedule) {
      try {
        const parsedSchedule = JSON.parse(savedSchedule);
        Object.keys(scheduleByDay).forEach(day => {
          if (Array.isArray(parsedSchedule[day])) {
            scheduleByDay[day] = parsedSchedule[day].slice(0, 6);
          }
        });
      } catch (error) {
        console.error('Saqlangan jadvalni o‘qib bo‘lmadi.', error);
      }
    }

    const dayToPart = {
      Dushanba: 1,
      Seshanba: 2,
      Chorshanba: 3,
      Payshanba: 4,
      Juma: 5,
      Shanba: 6,
      Yakshanba: 1
    };

    const todayDate = new Date();
    const uzDayNames = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
    const todayName = uzDayNames[todayDate.getDay()];
    const tomorrowDate = new Date(todayDate);
    tomorrowDate.setDate(todayDate.getDate() + 1);
    const tomorrowName = uzDayNames[tomorrowDate.getDay()];
    const tomorrowPart = dayToPart[tomorrowName] || 1;
    const todayText = `${todayDate.getDate()}.${String(todayDate.getMonth() + 1).padStart(2, '0')}.${todayDate.getFullYear()}`;
    const tomorrowText = `${tomorrowDate.getDate()}.${String(tomorrowDate.getMonth() + 1).padStart(2, '0')}.${tomorrowDate.getFullYear()}`;

    const defaultOpenDay = todayName === 'Shanba' ? 'Shanba' : (todayName === 'Yakshanba' ? 'Dushanba' : todayName);
    const dayImageUrl = 'dars.png';
    const restDayImageUrl = 'dam.png';
    const todayDay = todayName;

    document.getElementById('headerNote').textContent =
      `Bugun ${todayText} (${todayName}). Ertaga ${tomorrowText} (${tomorrowName}) kuni ${tomorrowPart}-qism ko'rsatiladi.`;

    const schedule = document.getElementById('schedule');
    const searchInput = document.getElementById('searchInput');
    const todayStat = document.getElementById('todayStat');
    const lessonStat = document.getElementById('lessonStat');
    const clockStat = document.getElementById('clockStat');
    const nextLesson = document.getElementById('nextLesson');
    const countdown = document.getElementById('countdown');
    const calendarTitle = document.getElementById('calendarTitle');
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarBody = document.getElementById('calendarBody');
    const calendarToggle = document.getElementById('calendarToggle');
    const calendarMonth = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    const selectedDate = new Date(todayDate);
    const monthNames = [
      'Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun',
      'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'
    ];
    const calendarWeekdays = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
    const lessonTimes = [
      ['08:00', '08:45'],
      ['08:50', '09:35'],
      ['09:45', '10:30'],
      ['10:40', '11:25'],
      ['11:35', '12:20'],
      ['12:30', '13:15']
    ];

    todayStat.textContent = todayName;
    lessonStat.textContent = todayName === 'Yakshanba'
      ? '0'
      : scheduleByDay[todayName].filter(subject => subject && subject !== '0').length;

    function updateClock() {
      clockStat.textContent = new Date().toLocaleTimeString('uz-UZ', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    function getTodayLesson(index) {
      const subject = scheduleByDay[todayName]?.[index];
      return subject && subject !== '0' && !subject.includes('-') ? subject : null;
    }

    function updateNextLesson() {
      if (todayName === 'Yakshanba') {
        nextLesson.textContent = 'Bugun dam olish kuni';
        countdown.textContent = '—';
        return;
      }

      const now = new Date();
      let nextIndex = -1;
      let target = null;

      lessonTimes.some((time, index) => {
        const [hours, minutes] = time[0].split(':');
        const start = new Date(now);
        start.setHours(Number(hours), Number(minutes), 0, 0);
        if (start > now && getTodayLesson(index)) {
          nextIndex = index;
          target = start;
          return true;
        }
        return false;
      });

      if (nextIndex === -1) {
        nextLesson.textContent = 'Bugungi darslar tugadi';
        countdown.textContent = '—';
        return;
      }

      nextLesson.textContent = `${nextIndex + 1}-dars: ${getTodayLesson(nextIndex)}`;
      const seconds = Math.max(0, Math.floor((target - now) / 1000));
      const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const remainSeconds = String(seconds % 60).padStart(2, '0');
      countdown.textContent = `${hours}:${minutes}:${remainSeconds}`;
    }

    updateNextLesson();
    setInterval(updateNextLesson, 1000);

    function renderCalendar() {
      calendarTitle.textContent = `${monthNames[calendarMonth.getMonth()]} ${calendarMonth.getFullYear()}`;
      calendarGrid.innerHTML = calendarWeekdays
        .map(day => `<div class="calendar-weekday">${day}</div>`)
        .join('');

      const firstDay = (new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), 1).getDay() + 6) % 7;
      const daysInMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 0).getDate();

      for (let index = 0; index < firstDay; index += 1) {
        calendarGrid.insertAdjacentHTML('beforeend', '<div class="calendar-day empty"></div>');
      }

      for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber += 1) {
        const date = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), dayNumber);
        const dayName = uzDayNames[date.getDay()];
        const hasLesson = dayName !== 'Yakshanba';
        const isToday = date.toDateString() === todayDate.toDateString();
        const isSelected = date.toDateString() === selectedDate.toDateString();
        const dayElement = document.createElement('div');

        dayElement.className = `calendar-day clickable ${hasLesson ? 'lesson-day' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
        dayElement.innerHTML = `${dayNumber}${hasLesson ? '<small>Dars</small>' : '<small>Dam</small>'}`;
        dayElement.addEventListener('click', () => {
          selectedDate.setTime(date.getTime());
          renderCalendar();

          const selectedDay = uzDayNames[selectedDate.getDay()];
          const selectedButton = [...document.querySelectorAll('.day-toggle')]
            .find(button => button.textContent === selectedDay);
          if (selectedButton) selectedButton.click();
        });
        calendarGrid.appendChild(dayElement);
      }
    }

    document.getElementById('previousMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() + 1);
      renderCalendar();
    });

    calendarToggle.addEventListener('click', () => {
      const isOpen = !calendarBody.classList.toggle('collapsed');
      calendarToggle.setAttribute('aria-expanded', String(isOpen));
      calendarToggle.querySelector('span:last-child').textContent = isOpen ? 'Yopish ▲' : 'Ochish ▼';
    });

    renderCalendar();

    function renderSchedule() {
      schedule.innerHTML = '';

      week.forEach((day) => {
      const subjects = scheduleByDay[day] || ['-'];
      const card = document.createElement('div');
      const isOpen = day === defaultOpenDay;
      const isSunday = day === 'Yakshanba';
      const isToday = day === todayDay;

      card.className = `day-card ${isOpen ? 'open' : ''}`;
      card.dataset.day = day;
      card.dataset.search = `${day} ${subjects.join(' ')}`.toLowerCase();
      if (isSunday) {
        card.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.35), rgba(0,0,0)), url('${restDayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      } else {
        card.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.35), rgba(0,0,0)), url('${dayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = `day-toggle ${isOpen ? 'active' : ''} ${isToday ? 'today-button' : ''}`;
      button.textContent = day;

      if (isSunday) {
        button.style.color = '#000';
        button.style.fontWeight = '700';
      }

      if (isToday) {
        button.style.border = '2px solid #fff';
        button.style.borderRadius = '8px';
      }

      const content = document.createElement('div');
      content.className = 'day-content';
      content.innerHTML = `
        <ul class="subjects">
          ${subjects.map((subject, index) => `
            <li>
              <span class="lesson-number">${subject === 'Dam olish kuni' ? '' : index + 1}</span>
              ${subject === 'Dam olish kuni'
                ? '<span>Dam olish kuni</span>'
                : `<input class="subject-input" value="${subject.replace(/"/g, '&quot;')}" aria-label="${day} ${index + 1}-dars fani">`}
              ${subject !== '0' && subject !== 'Dam olish kuni' && !subject.includes('-') && lessonTimes[index]
                ? `<small>${lessonTimes[index][0]} – ${lessonTimes[index][1]}</small>`
                : ''}
            </li>
          `).join('')}
        </ul>
        <button class="save-day-button" type="button">Saqlash</button>
      `;

      if (!isOpen) {
        content.classList.add('collapsed');
      }

      button.addEventListener('click', () => {
        const isVisible = !content.classList.contains('collapsed');

        document.querySelectorAll('.day-content').forEach(el => {
          el.style.transition = 'max-height 0.5s ease, opacity 0.5s ease, padding 0.5s ease, margin 0.5s ease';
          el.classList.add('collapsed');
        });
        document.querySelectorAll('.day-toggle').forEach(el => {
          el.classList.remove('active');
        });

        if (!isVisible) {
          content.style.transition = 'max-height 1s ease, opacity 1s ease, padding 1s ease, margin 1s ease';
          content.classList.remove('collapsed');
          button.classList.add('active');
        }
      });

      card.appendChild(button);
      card.appendChild(content);
      schedule.appendChild(card);
      });

      searchInput.dispatchEvent(new Event('input'));
    }

    renderSchedule();

    function saveDay(card) {
      const dayName = week.find(day => card.dataset.day === day);
      if (!dayName) return;

      const inputs = [...card.querySelectorAll('.subject-input')];
      scheduleByDay[dayName] = inputs.map(input => input.value.trim());
      localStorage.setItem('schoolSchedule', JSON.stringify(scheduleByDay));
      lessonStat.textContent = todayName === 'Yakshanba'
        ? '0'
        : scheduleByDay[todayName].filter(subject => subject && subject !== '0').length;
      renderSchedule();
      updateNextLesson();
      const newCard = [...document.querySelectorAll('.day-card')]
        .find(item => item.dataset.day === dayName);
      const saveButton = newCard?.querySelector('.save-day-button');
      if (saveButton) saveButton.textContent = 'Saqlandi ✓';
      setTimeout(() => {
        if (saveButton) saveButton.textContent = 'Saqlash';
      }, 1500);
    }

    document.addEventListener('click', event => {
      if (event.target.classList.contains('save-day-button')) {
        saveDay(event.target.closest('.day-card'));
      }
    });

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.day-card').forEach(card => {
        card.classList.toggle('hidden-card', !card.dataset.search.includes(query));
      });
    });
  </script>
</body>


</html>
