<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dars jadvali — School Schedule</title>
  <meta name="description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:title" content="Dars jadvali — School Schedule" />
  <meta property="og:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dars jadvali — School Schedule" />
  <meta name="twitter:description" content="School Schedul: oson va tez dars jadvali yaratish va boshqarish uchun veb-ilova." />

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 30px 20px;
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    background-image: linear-gradient(rgba(15, 23, 42, .38), rgba(15, 23, 42, .38)), url('orqafon.png');
    background-size: 100% 100%;
    background-position: top center;
    background-attachment: fixed;
    color: #e2e8f0;
    background-repeat: no-repeat;
  }

  .container {
    width: min(96vw, 1500px);
    max-width: 1500px;
    margin: 0 auto;
  }

  .topbar, .hero, .tools, .stats {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
  }

  .topbar {
    position: sticky;
    top: 10px;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 66px;
    padding: 12px 150px 12px 70px;
    margin-bottom: 22px;
  }

  .brand {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    letter-spacing: .4px;
    white-space: nowrap;
  }
  .brand span { color: #38bdf8; }
  .live {
    position: absolute;
    left: 70px;
    color: #86efac;
    font-size: 13px;
    white-space: nowrap;
  }

  .hero {
    padding: 28px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #1e3a8a, #0f766e);
  }

  .hero h1 { text-align: left; margin: 0 0 8px; color: white; }
  .hero p { margin: 0; color: #dbeafe; }

  .tools {
    display: flex;
    gap: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .tools input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 15px;
  }

  .tools button {
    border: 0;
    border-radius: 10px;
    padding: 0 18px;
    background: #38bdf8;
    color: #082f49;
    font-weight: 800;
    cursor: pointer;
  }

  .tools button:hover { background: #7dd3fc; }

  .menu-button {
    position: absolute;
    top: 10px;
    left: 14px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #1e293b;
    color: #fff;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
  }

  .language-select {
    display: none;
  }
  .language-picker {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 20;
    width: max-content;
    min-width: 78px;
    color: #0f172a;
  }
  .language-current {
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 18px;
    border: 1px solid #38bdf8;
    background: rgba(15, 23, 42, .96);
    color: #e2e8f0;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    white-space: nowrap;
  }
  .language-current::after {
    content: '⌄';
    float: right;
    font-size: 16px;
  }
  .language-options {
    display: none;
    overflow: hidden;
    margin-top: 2px;
    border-radius: 0 0 18px 18px;
    border: 1px solid #334155;
    border-top: 0;
    background: rgba(15, 23, 42, .98);
    box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
  }
  .language-picker.open .language-options { display: block; }
  .language-option {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 10px;
    padding: 10px 14px;
    border: 0;
    background: transparent;
    color: #e2e8f0;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .language-option:hover,
  .language-option.active { background: #1e3a5f; color: #7dd3fc; }
  .language-flag { font-size: 22px; line-height: 1; }

  .intro-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #0f766e);
    transition: opacity .45s ease, visibility .45s ease;
  }

  .intro-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-content {
    text-align: center;
    color: #fff;
  }

  .intro-logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    border: 5px solid rgba(255, 255, 255, .3);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: intro-spin 1s linear infinite;
  }

  .intro-content h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 5vw, 38px);
  }

  .intro-content p {
    margin: 0;
    color: #dbeafe;
  }

  @keyframes intro-spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 600px) {
    .live { left: 64px; font-size: 11px; }
    .language-picker { right: 8px; min-width: 78px; }
  }

  .menu-button:hover { background: #334155; }

  .side-panel {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 15;
    width: min(340px, 88vw);
    padding: 70px 10px 16px;
    overflow-y: auto;
    background: #0f172a;
    border-right: 1px solid #475569;
    box-shadow: 8px 0 24px rgba(0, 0, 0, .35);
    transform: translateX(-105%);
    transition: transform .25s ease;
  }

  .side-panel.open { transform: translateX(0); }

  .back-menu-link {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    width: calc(100% - 20px);
  }

  .menu-link {
    display: block;
    margin-bottom: 10px;
    padding: 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #1e293b;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }

  .menu-link:hover { background: #334155; }

  .side-panel .calendar {
    margin-top: 12px;
    margin-bottom: 0;
    padding: 10px;
    border-radius: 12px;
  }

  .side-panel .calendar-header {
    margin-bottom: 10px;
  }

  .side-panel .calendar-header h2 {
    font-size: 16px;
  }

  .side-panel .calendar-day {
    min-height: 32px;
    padding: 5px 2px;
    font-size: 12px;
  }

  .save-button {
    display: block;
    margin: 22px auto 0;
    border: 0;
    border-radius: 10px;
    padding: 12px 28px;
    background: #38bdf8;
    color: #082f49;
    font-weight: 800;
    cursor: pointer;
  }

  .save-button:hover { background: #7dd3fc; }

  .save-day-button {
    width: 100%;
    margin-top: 12px;
    border: 1px solid #38bdf8;
    border-radius: 8px;
    padding: 9px;
    background: #0284c7;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .save-day-button:hover { background: #0369a1; }

  .tools button, .day-toggle {
    transition: .25s ease;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .next-lesson {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 18px;
    margin-bottom: 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
  }

  .next-lesson small { color: #94a3b8; display: block; margin-bottom: 5px; }
  .next-lesson strong { color: #fff; font-size: 20px; }
  .countdown { color: #38bdf8; font-size: 24px; font-weight: 800; white-space: nowrap; }

  .calendar {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-header h2 { margin: 0; font-size: 20px; color: #fff; }
  .calendar-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    padding: 0;
  }
  .calendar-toggle span:last-child { color: #38bdf8; font-size: 14px; }
  .calendar-body {
    max-height: 500px;
    opacity: 1;
    overflow: hidden;
    transition: max-height .5s ease, opacity .5s ease, margin-top .5s ease;
  }
  .calendar-body.collapsed {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
  }
  .calendar-header button {
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 6px 10px;
    background: #0f172a;
    color: #fff;
    cursor: pointer;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .calendar-weekday {
    padding: 6px 2px;
    color: #94a3b8;
    font-size: 12px;
    text-align: center;
  }

  .calendar-day {
    min-height: 42px;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 4px;
    background: #0f172a;
    color: #cbd5e1;
    text-align: center;
  }

  .calendar-day.lesson-day { border-color: #0ea5e9; color: #fff; }
  .calendar-day.today { background: #0284c7; border-color: #7dd3fc; color: #fff; font-weight: 800; }
  .calendar-day.selected {
    border: 2px solid #facc15;
    box-shadow: 0 0 0 3px rgba(250, 204, 21, .3);
    transform: translateY(-2px);
  }
  .calendar-day.clickable { cursor: pointer; }
  .calendar-day.clickable:hover { border-color: #facc15; }
  .calendar-day.empty { border-color: transparent; background: transparent; }
  .calendar-day small { display: block; margin-top: 3px; color: #86efac; font-size: 9px; }

  .stat { padding: 12px; background: #0f172a; border-radius: 12px; }
  .stat strong { display: block; font-size: 22px; color: #38bdf8; }
  .stat small { color: #94a3b8; }

  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-size: 30px;
  }

  .header-note {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 22px;
  }

  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .personal-library {
    margin-top: 18px;
    padding: 18px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
  }

  .personal-library h2 {
    margin: 0 0 12px;
    color: #fff;
    font-size: 20px;
  }

  .personal-library-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .personal-book {
    padding: 9px 10px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
  }

  .personal-book strong {
    color: #7dd3fc;
    margin-right: 5px;
  }

  .day-card {
    background: #fff;
    border: 1px solid #000000;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .day-card.open {
    border: 2px solid #030303;
    background: #eef7ff;
  }

  .day-toggle {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    padding: 8px 8px 12px;
    color: #ffffff;
    transition: .25s ease;
  }

  .day-toggle.active {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 8px;
  }

  .day-card.sunday-card .day-toggle,
  .day-card.sunday-card .day-content,
  .day-card.sunday-card .subjects li {
    color: snow;
  }

  .today-button {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.12);
  }

  .day-content {
    margin-top: 8px;
    background: rgba(0, 0, 0, 0.28);
    padding: 8px 10px;
    border-radius: 8px;
    max-height: 1000px;
    opacity: 1;
    overflow: hidden;
    transition: max-height 1s ease, opacity 1s ease, padding 0.5s ease, margin 0.5s ease;
  }

  .day-content.collapsed {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-top: 0;
  }

  .subjects {
    list-style: none;
    margin: 0;
    padding: 0;
    color: #000000;
  }

  .subjects li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    line-height: 1.4;
    color: #ffffff;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  }

  .subject-input {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    font-size: 16px;
  }

  .subjects li small {
    color: #bae6fd;
    white-space: nowrap;
    font-size: 12px;
  }

  .subject-input {
    width: 100%;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 6px;
    padding: 7px 8px;
    background: rgba(15,23,42,.75);
    color: #fff;
    font: inherit;
  }

  .lesson-number {
    min-width: 18px;
    color: #bae6fd;
    font-weight: 800;
  }

  .subjects li:last-child {
    border-bottom: 0;
  }

  .empty {
    color: #fff;
    font-style: italic;
  }

  .day-card.hidden-card { display: none; }
  .no-results { text-align: center; color: #94a3b8; padding: 30px; }

  @media (max-width: 600px) {
    body {
      padding: 12px 8px 24px;
    }

    .container {
      width: 100%;
    }

    .topbar {
      padding: 13px 14px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    .hero {
      padding: 20px 16px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    h1 {
      font-size: 24px;
    }

    .header-note {
      font-size: 15px;
      line-height: 1.4;
    }

    .day-name {
      font-size: 18px;
    }

    .tools {
      flex-direction: column;
      padding: 10px;
    }

    .tools button {
      min-height: 42px;
    }

    .stats {
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
    }

    .stat {
      padding: 10px 5px;
      text-align: center;
    }

    .stat strong {
      font-size: 16px;
    }

    .stat small {
      font-size: 11px;
    }

    .next-lesson {
      align-items: flex-start;
      flex-direction: column;
      padding: 14px;
    }

    .next-lesson strong {
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .countdown {
      font-size: 21px;
    }

    .calendar {
      padding: 12px;
    }

    .day-card {
      min-width: 0;
      padding: 8px;
    }

    .subjects li {
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .subjects li small {
      margin-left: 0;
      font-size: 10px;
    }

    .subject-input {
      min-width: 0;
      font-size: 14px;
      padding: 8px 6px;
    }

    .schedule-grid { grid-template-columns: 1fr; }

    .personal-library {
      padding: 12px;
      border-radius: 12px;
    }

    .personal-library-list {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>
  <div id="introScreen" class="intro-screen" aria-label="Sayt yuklanmoqda">
    <div class="intro-content">
      <div class="intro-logo" aria-hidden="true"></div>
      <h1>School <span>Schedule</span></h1>
      <p>Jadval yuklanmoqda...</p>
    </div>
  </div>
  <select id="languageSelect" class="language-select" aria-label="Til">
    <option value="uz">🇺🇿 O‘zbek</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="en">🇬🇧 English</option>
  </select>
  <div class="container">
    <aside id="sidePanel" class="side-panel" aria-hidden="true">
      <button id="backButton" class="menu-link back-menu-link" type="button">✕ Menyuni yopish</button>
      <a class="menu-link" href="kundalik.html">Kundalikni yangilash</a>
      <a class="menu-link" href="mening-darslarim.html">Mening darslarim va kitoblarim</a>
      <section class="calendar">
        <div class="calendar-header">
          <button id="calendarToggle" class="calendar-toggle" type="button" aria-expanded="true">
            <span id="calendarTitle"></span>
            <span>Yopish ▲</span>
          </button>
        </div>
        <div id="calendarBody" class="calendar-body">
          <div class="calendar-header">
            <button id="previousMonth" type="button" aria-label="Oldingi oy">‹</button>
            <span></span>
            <button id="nextMonth" type="button" aria-label="Keyingi oy">›</button>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
      </section>
    </aside>
    <header class="topbar">
      <button id="menuButton" class="menu-button" type="button" aria-label="Menyuni ochish" aria-expanded="false">☰</button>
      <div class="brand">School <span>Schedule</span></div>
      <div class="live">● Jonli jadval</div>
      <div id="languagePicker" class="language-picker">
        <button id="languageCurrent" class="language-current" type="button"></button>
        <div class="language-options">
          <button class="language-option" type="button" data-language="en">EN</button>
          <button class="language-option" type="button" data-language="ru">RU</button>
          <button class="language-option" type="button" data-language="uz">UZ</button>
        </div>
      </div>
    </header>
    <section class="hero">
      <h1>Dars jadvali</h1>
      <p id="headerNote"></p>
    </section>
    <section class="tools">
      <input id="searchInput" type="search" placeholder="Fan yoki kunni qidiring...">
    </section>
    <section class="stats">
      <div class="stat"><strong id="todayStat">—</strong><small>Bugungi kun</small></div>
      <div class="stat"><strong id="lessonStat">—</strong><small>Bugungi darslar</small></div>
      <div class="stat"><strong id="clockStat">--:--</strong><small>Hozirgi vaqt</small></div>
    </section>
    <section class="next-lesson">
      <div>
        <small>Keyingi dars</small>
        <strong id="nextLesson">Hisoblanmoqda...</strong>
      </div>
      <div id="countdown" class="countdown">--:--:--</div>
    </section>
    <section class="calendar">
      <div class="calendar-header">
        <button id="mainCalendarToggle" class="calendar-toggle" type="button" aria-expanded="true">
          <span>Hafta kalendari</span>
          <span>Yopish ▲</span>
        </button>
      </div>
      <div id="mainCalendarBody" class="calendar-body">
        <div class="calendar-header">
          <button id="mainPreviousMonth" type="button" aria-label="Oldingi oy">‹</button>
          <span id="mainCalendarTitle"></span>
          <button id="mainNextMonth" type="button" aria-label="Keyingi oy">›</button>
        </div>
        <div id="mainCalendarGrid" class="calendar-grid"></div>
      </div>
    </section>
    <div id="schedule" class="schedule-grid"></div>
    <section class="personal-library">
      <h2>Mening darslarim va kitoblarim</h2>
      <div id="personalLibraryList" class="personal-library-list"></div>
    </section>
  </div>

  <script>
    const introScreen = document.getElementById('introScreen');
    const introSeenKey = 'schoolScheduleIntroSeen';
    if (localStorage.getItem(introSeenKey)) {
      introScreen.classList.add('hide');
    } else {
      localStorage.setItem(introSeenKey, 'true');
      window.setTimeout(() => {
        introScreen.classList.add('hide');
      }, 3000);
    }

    const languageSelect = document.getElementById('languageSelect');
    const languagePicker = document.getElementById('languagePicker');
    const languageCurrent = document.getElementById('languageCurrent');
    const languageLabels = { uz: 'UZ', ru: 'RU', en: 'EN' };
    languageCurrent.textContent = languageLabels[localStorage.getItem('siteLanguage') || 'uz'];
    languageCurrent.addEventListener('click', () => languagePicker.classList.toggle('open'));
    document.querySelectorAll('.language-option').forEach(option => {
      option.addEventListener('click', () => {
        languageSelect.value = option.dataset.language;
        languageSelect.dispatchEvent(new Event('change'));
        languageCurrent.textContent = languageLabels[languageSelect.value];
        languagePicker.classList.remove('open');
      });
    });
    const translations = {
      uz: { schedule: 'Dars jadvali', diary: 'Kundalikni yangilash', library: 'Mening darslarim va kitoblarim', menuClose: '✕ Menyuni yopish', search: 'Fan yoki kunni qidiring...', week: 'Hafta kalendari', next: 'Keyingi dars', today: 'Bugungi kun', lessons: 'Bugungi darslar', clock: 'Hozirgi vaqt', empty: 'Hozircha dars yoki kitob kiritilmagan.', sunday: 'Bugun dam olish kuni', finished: 'Bugungi darslar tugadi', lesson: 'Dars', rest: 'Dam', save: 'Saqlash', saved: 'Saqlandi ✓', close: 'Yopish ▲', open: 'Ochish ▼', weekdays: ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'], days: ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba', 'Yakshanba'] },
      ru: { schedule: 'Расписание уроков', diary: 'Обновить дневник', library: 'Мои уроки и книги', menuClose: '✕ Закрыть меню', search: 'Поиск предмета или дня...', week: 'Календарь недели', next: 'Следующий урок', today: 'Сегодня', lessons: 'Уроков сегодня', clock: 'Текущее время', empty: 'Пока нет добавленных уроков или книг.', sunday: 'Сегодня выходной', finished: 'Уроки на сегодня закончились', lesson: 'Урок', rest: 'Выходной', save: 'Сохранить', saved: 'Сохранено ✓', close: 'Закрыть ▲', open: 'Открыть ▼', weekdays: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], days: ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'] },
      en: { schedule: 'Class schedule', diary: 'Update diary', library: 'My lessons and books', menuClose: '✕ Close menu', search: 'Search subject or day...', week: 'Weekly calendar', next: 'Next lesson', today: 'Today', lessons: 'Lessons today', clock: 'Current time', empty: 'No lessons or books have been added yet.', sunday: 'Today is a day off', finished: 'Today’s lessons are over', lesson: 'Lesson', rest: 'Day off', save: 'Save', saved: 'Saved ✓', close: 'Close ▲', open: 'Open ▼', weekdays: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'], days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] }
    };
    function applyLanguage(language) {
      const text = translations[language];
      document.querySelector('.hero h1').textContent = text.schedule;
      document.querySelector('.menu-link[href="kundalik.html"]').textContent = text.diary;
      document.querySelector('.menu-link[href="mening-darslarim.html"]').textContent = text.library;
      document.getElementById('backButton').textContent = text.menuClose;
      document.querySelector('.personal-library h2').textContent = text.library;
      document.getElementById('searchInput').placeholder = text.search;
      document.querySelector('#mainCalendarToggle span:first-child').textContent = text.week;
      document.querySelector('.next-lesson small').textContent = text.next;
      document.querySelectorAll('.stat small')[0].textContent = text.today;
      document.querySelectorAll('.stat small')[1].textContent = text.lessons;
      document.querySelectorAll('.stat small')[2].textContent = text.clock;
      document.querySelectorAll('.calendar-weekday').forEach((weekday, index) => {
        weekday.textContent = text.weekdays[index];
      });
      document.querySelectorAll('.day-toggle').forEach((button, index) => {
        button.textContent = text.days[index];
      });
      document.querySelectorAll('.save-day-button').forEach(button => {
        button.textContent = text.save;
      });
      document.querySelector('#calendarToggle span:last-child').textContent = document.getElementById('calendarBody').classList.contains('collapsed') ? text.open : text.close;
      document.querySelector('#mainCalendarToggle span:last-child').textContent = document.getElementById('mainCalendarBody').classList.contains('collapsed') ? text.open : text.close;
      document.documentElement.lang = language;
      localStorage.setItem('siteLanguage', language);
      languageCurrent.textContent = languageLabels[language];
      document.querySelectorAll('.language-option').forEach(option => {
        option.classList.toggle('active', option.dataset.language === language);
      });
    }
    languageSelect.value = localStorage.getItem('siteLanguage') || 'uz';
    applyLanguage(languageSelect.value);
    languageSelect.addEventListener('change', event => {
      applyLanguage(event.target.value);
      updateDynamicLanguage();
      renderCalendars();
      renderSchedule();
    });

    const sections = [
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ],
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ],
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ],
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ],
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ],
      [
        '',
        '',
        '',
        '',
        '',
        ''
      ]
    ];

    const week = [
      'Dushanba',
      'Seshanba',
      'Chorshanba',
      'Payshanba',
      'Juma',
      'Shanba',
      'Yakshanba'
    ];

    const scheduleByDay = {
      Dushanba: sections[0],
      Seshanba: sections[1],
      Chorshanba: sections[2],
      Payshanba: sections[3],
      Juma: sections[4],
      Shanba: sections[5],
      Yakshanba: ['Dam olish kuni']
    };

    const personalItems = JSON.parse(localStorage.getItem('myScheduleItems') || '[]')
      .map(item => String(item || '').trim());
    const getSubjectName = subject => {
      const itemNumber = Number(String(subject).trim());
      return Number.isInteger(itemNumber) && itemNumber >= 1 && itemNumber <= 36
        ? (personalItems[itemNumber - 1] || `${itemNumber}-raqam`)
        : subject;
    };

    Object.keys(scheduleByDay).forEach(day => {
      scheduleByDay[day] = scheduleByDay[day].map(subject =>
        getSubjectName(subject.replace(/^\d+\s*/, ''))
      );
    });

    const savedSchedule = localStorage.getItem('schoolSchedule');
    if (savedSchedule) {
      try {
        const parsedSchedule = JSON.parse(savedSchedule);
        Object.keys(scheduleByDay).forEach(day => {
          if (Array.isArray(parsedSchedule[day])) {
            scheduleByDay[day] = parsedSchedule[day].slice(0, 6).map(getSubjectName);
          }
        });
      } catch (error) {
        console.error('Saqlangan jadvalni o‘qib bo‘lmadi.', error);
      }
    }

    const dayToPart = {
      Dushanba: 1,
      Seshanba: 2,
      Chorshanba: 3,
      Payshanba: 4,
      Juma: 5,
      Shanba: 6,
      Yakshanba: 1
    };

    const todayDate = new Date();
    const uzDayNames = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
    const todayName = uzDayNames[todayDate.getDay()];
    const tomorrowDate = new Date(todayDate);
    tomorrowDate.setDate(todayDate.getDate() + 1);
    const tomorrowName = uzDayNames[tomorrowDate.getDay()];
    const tomorrowPart = dayToPart[tomorrowName] || 1;
    const todayText = `${todayDate.getDate()}.${String(todayDate.getMonth() + 1).padStart(2, '0')}.${todayDate.getFullYear()}`;
    const tomorrowText = `${tomorrowDate.getDate()}.${String(tomorrowDate.getMonth() + 1).padStart(2, '0')}.${tomorrowDate.getFullYear()}`;

    const defaultOpenDay = todayName === 'Shanba' ? 'Shanba' : (todayName === 'Yakshanba' ? 'Dushanba' : todayName);
    const dayImageUrl = 'dars.png';
    const restDayImageUrl = 'dam.png';
    const todayDay = todayName;

    document.getElementById('headerNote').textContent =
      `Bugun ${todayText} (${todayName}). Ertaga ${tomorrowText} (${tomorrowName}) kuni ${tomorrowPart}-qism ko'rsatiladi.`;

    const schedule = document.getElementById('schedule');
    const personalLibraryList = document.getElementById('personalLibraryList');
    const searchInput = document.getElementById('searchInput');
    const menuButton = document.getElementById('menuButton');
    const sidePanel = document.getElementById('sidePanel');
    const todayStat = document.getElementById('todayStat');
    const lessonStat = document.getElementById('lessonStat');
    const clockStat = document.getElementById('clockStat');
    const nextLesson = document.getElementById('nextLesson');
    const countdown = document.getElementById('countdown');
    const calendarTitle = document.getElementById('calendarTitle');
    const calendarGrid = document.getElementById('calendarGrid');
    const mainCalendarTitle = document.getElementById('mainCalendarTitle');
    const mainCalendarGrid = document.getElementById('mainCalendarGrid');
    const calendarBody = document.getElementById('calendarBody');
    const calendarToggle = document.getElementById('calendarToggle');
    const mainCalendarBody = document.getElementById('mainCalendarBody');
    const mainCalendarToggle = document.getElementById('mainCalendarToggle');
    const calendarMonth = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    const selectedDate = new Date(todayDate);
    const monthNames = [
      'Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun',
      'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'
    ];
    const calendarWeekdays = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
    const lessonTimes = [
      ['08:00', '08:45'],
      ['08:50', '09:35'],
      ['09:45', '10:30'],
      ['10:40', '11:25'],
      ['11:35', '12:20'],
      ['12:30', '13:15']
    ];

    function updateDynamicLanguage() {
      const text = translations[languageSelect.value];
      const dayIndexes = { Dushanba: 0, Seshanba: 1, Chorshanba: 2, Payshanba: 3, Juma: 4, Shanba: 5, Yakshanba: 6 };
      const dayTodayIndex = dayIndexes[todayName];
      const dayTomorrowIndex = dayIndexes[tomorrowName];
      const tomorrowWord = languageSelect.value === 'uz' ? 'Ertaga' : languageSelect.value === 'ru' ? 'Завтра' : 'Tomorrow';
      document.getElementById('headerNote').textContent = `${text.today} ${todayText} (${text.days[dayTodayIndex]}). ${tomorrowWord} ${tomorrowText} (${text.days[dayTomorrowIndex]}).`;
      document.getElementById('todayStat').textContent = text.days[dayTodayIndex];
      if (todayName === 'Yakshanba') nextLesson.textContent = text.sunday;
      renderPersonalLibrary();
    }

    function renderPersonalLibrary() {
      const items = JSON.parse(localStorage.getItem('myScheduleItems') || '[]')
        .map(item => String(item || '').trim())
        .filter(Boolean);
      personalLibraryList.innerHTML = items.length
        ? items.map((item, index) => `<div class="personal-book"><strong>${index + 1}.</strong>${item.replace(/</g, '&lt;')}</div>`).join('')
        : `<div class="no-results">${translations[languageSelect.value].empty}</div>`;
    }

    renderPersonalLibrary();
    updateDynamicLanguage();

    menuButton.addEventListener('click', () => {
      const isOpen = sidePanel.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'Menyuni yopish' : 'Menyuni ochish');
      sidePanel.setAttribute('aria-hidden', String(!isOpen));
    });
    document.getElementById('backButton').addEventListener('click', () => {
      sidePanel.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
      menuButton.setAttribute('aria-label', 'Menyuni ochish');
      sidePanel.setAttribute('aria-hidden', 'true');
    });

    todayStat.textContent = todayName;
    lessonStat.textContent = todayName === 'Yakshanba'
      ? '0'
      : scheduleByDay[todayName].filter(subject => subject && subject !== '0').length;

    function updateClock() {
      clockStat.textContent = new Date().toLocaleTimeString('uz-UZ', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    function getTodayLesson(index) {
      const subject = scheduleByDay[todayName]?.[index];
      return subject && subject !== '0' && !subject.includes('-') ? subject : null;
    }

    function updateNextLesson() {
      if (todayName === 'Yakshanba') {
        nextLesson.textContent = translations[languageSelect.value].sunday;
        countdown.textContent = '—';
        return;
      }

      const now = new Date();
      let nextIndex = -1;
      let target = null;

      lessonTimes.some((time, index) => {
        const [hours, minutes] = time[0].split(':');
        const start = new Date(now);
        start.setHours(Number(hours), Number(minutes), 0, 0);
        if (start > now && getTodayLesson(index)) {
          nextIndex = index;
          target = start;
          return true;
        }
        return false;
      });

      if (nextIndex === -1) {
        nextLesson.textContent = translations[languageSelect.value].finished;
        countdown.textContent = '—';
        return;
      }

      nextLesson.textContent = `${nextIndex + 1}-dars: ${getTodayLesson(nextIndex)}`;
      const seconds = Math.max(0, Math.floor((target - now) / 1000));
      const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const remainSeconds = String(seconds % 60).padStart(2, '0');
      countdown.textContent = `${hours}:${minutes}:${remainSeconds}`;
    }

    updateNextLesson();
    setInterval(updateNextLesson, 1000);

    function renderCalendar(targetTitle = calendarTitle, targetGrid = calendarGrid) {
      targetTitle.textContent = `${monthNames[calendarMonth.getMonth()]} ${calendarMonth.getFullYear()}`;
      targetGrid.innerHTML = translations[languageSelect.value].weekdays
        .map(day => `<div class="calendar-weekday">${day}</div>`)
        .join('');

      const firstDay = (new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), 1).getDay() + 6) % 7;
      const daysInMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 0).getDate();

      for (let index = 0; index < firstDay; index += 1) {
        targetGrid.insertAdjacentHTML('beforeend', '<div class="calendar-day empty"></div>');
      }

      for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber += 1) {
        const date = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), dayNumber);
        const dayName = uzDayNames[date.getDay()];
        const hasLesson = dayName !== 'Yakshanba';
        const isToday = date.toDateString() === todayDate.toDateString();
        const isSelected = date.toDateString() === selectedDate.toDateString();
        const dayElement = document.createElement('div');

        dayElement.className = `calendar-day clickable ${hasLesson ? 'lesson-day' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
        const labels = translations[languageSelect.value];
        dayElement.innerHTML = `${dayNumber}${hasLesson ? `<small>${labels.lesson}</small>` : `<small>${labels.rest}</small>`}`;
        dayElement.addEventListener('click', () => {
          selectedDate.setTime(date.getTime());
          renderCalendars();

          const selectedDay = uzDayNames[selectedDate.getDay()];
          const selectedButton = [...document.querySelectorAll('.day-toggle')]
            .find(button => button.textContent === selectedDay);
          if (selectedButton) selectedButton.click();
        });
        targetGrid.appendChild(dayElement);
      }
    }

    function renderCalendars() {
      renderCalendar();
      renderCalendar(mainCalendarTitle, mainCalendarGrid);
    }

    document.getElementById('previousMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() - 1);
      renderCalendars();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() + 1);
      renderCalendars();
    });

    document.getElementById('mainPreviousMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() - 1);
      renderCalendars();
    });

    document.getElementById('mainNextMonth').addEventListener('click', () => {
      calendarMonth.setMonth(calendarMonth.getMonth() + 1);
      renderCalendars();
    });

    calendarToggle.addEventListener('click', () => {
      const isOpen = !calendarBody.classList.toggle('collapsed');
      calendarToggle.setAttribute('aria-expanded', String(isOpen));
      const text = translations[languageSelect.value];
      calendarToggle.querySelector('span:last-child').textContent = isOpen ? text.close : text.open;
    });

    mainCalendarToggle.addEventListener('click', () => {
      const isOpen = !mainCalendarBody.classList.toggle('collapsed');
      mainCalendarToggle.setAttribute('aria-expanded', String(isOpen));
      const text = translations[languageSelect.value];
      mainCalendarToggle.querySelector('span:last-child').textContent = isOpen ? text.close : text.open;
    });

    renderCalendars();

    function renderSchedule() {
      schedule.innerHTML = '';

      week.forEach((day, dayIndex) => {
      const subjects = scheduleByDay[day] || ['', '', '', '', '', ''];
      const card = document.createElement('div');
      const isOpen = day === defaultOpenDay;
      const isSunday = day === 'Yakshanba';
      const isToday = day === todayDay;

      card.className = `day-card ${isOpen ? 'open' : ''} ${isSunday ? 'sunday-card' : ''}`;
      card.dataset.day = day;
      card.dataset.search = `${day} ${subjects.join(' ')}`.toLowerCase();
      if (isSunday) {
        card.style.backgroundImage = `linear-gradient(rgba(15,23,42,0.12), rgba(0,0,0,0.38)), url('${restDayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      } else {
        card.style.backgroundImage = `linear-gradient(rgba(15,23,42,0.12), rgba(0,0,0,0.38)), url('${dayImageUrl}')`;
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
        card.style.backgroundRepeat = 'no-repeat';
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = `day-toggle ${isOpen ? 'active' : ''} ${isToday ? 'today-button' : ''}`;
      button.textContent = translations[languageSelect.value].days[dayIndex];

      if (isSunday) {
        button.style.color = 'snow';
        button.style.fontWeight = '700';
      }

      if (isToday) {
        button.style.border = '2px solid #fff';
        button.style.borderRadius = '8px';
      }

      const content = document.createElement('div');
      content.className = 'day-content';
      content.innerHTML = `
        <ul class="subjects">
          ${subjects.map((subject, index) => `
            <li>
              <span class="lesson-number">${subject === 'Dam olish kuni' ? '' : index + 1}</span>
              ${subject === 'Dam olish kuni'
                ? '<span>Dam olish kuni</span>'
                : `<input class="subject-input" value="${(subject || '').replace(/"/g, '&quot;')}" aria-label="${day} ${index + 1}-dars fani">`}
              ${subject !== 'Dam olish kuni' && lessonTimes[index]
                ? `<small>${lessonTimes[index][0]} – ${lessonTimes[index][1]}</small>`
                : ''}
            </li>
          `).join('')}
        </ul>
        ${isSunday ? '' : `<button class="save-day-button" type="button">${translations[languageSelect.value].save}</button>`}
      `;

      if (!isOpen) {
        content.classList.add('collapsed');
      }

      button.addEventListener('click', () => {
        const isVisible = !content.classList.contains('collapsed');

        document.querySelectorAll('.day-content').forEach(el => {
          el.style.transition = 'max-height 0.5s ease, opacity 0.5s ease, padding 0.5s ease, margin 0.5s ease';
          el.classList.add('collapsed');
        });
        document.querySelectorAll('.day-toggle').forEach(el => {
          el.classList.remove('active');
        });

        if (!isVisible) {
          content.style.transition = 'max-height 1s ease, opacity 1s ease, padding 1s ease, margin 1s ease';
          content.classList.remove('collapsed');
          button.classList.add('active');
        }
      });

      card.appendChild(button);
      card.appendChild(content);
      schedule.appendChild(card);
      });

      searchInput.dispatchEvent(new Event('input'));
    }

    renderSchedule();

    function saveDay(card) {
      const dayName = week.find(day => card.dataset.day === day);
      if (!dayName) return;

      const inputs = [...card.querySelectorAll('.subject-input')];
      scheduleByDay[dayName] = inputs.map(input => input.value.trim());
      localStorage.setItem('schoolSchedule', JSON.stringify(scheduleByDay));
      lessonStat.textContent = todayName === 'Yakshanba'
        ? '0'
        : scheduleByDay[todayName].filter(subject => subject && subject !== '0').length;
      renderSchedule();
      updateNextLesson();
      const newCard = [...document.querySelectorAll('.day-card')]
        .find(item => item.dataset.day === dayName);
      const saveButton = newCard?.querySelector('.save-day-button');
      if (saveButton) saveButton.textContent = translations[languageSelect.value].saved;
      setTimeout(() => {
        if (saveButton) saveButton.textContent = translations[languageSelect.value].save;
      }, 1500);
    }

    document.addEventListener('click', event => {
      if (event.target.classList.contains('save-day-button')) {
        saveDay(event.target.closest('.day-card'));
      }
    });

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.day-card').forEach(card => {
        card.classList.toggle('hidden-card', !card.dataset.search.includes(query));
      });
    });

  </script>
